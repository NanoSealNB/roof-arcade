<body>
<header class="arcade-header">
  <p class="kicker">NanoSeal NB</p>
  <h1>PUT YOUR ROOF KNOWLEDGE TO THE TEST</h1>
  <p class="subtitle">Take on New Brunswick weather in a collection of fast, free, 20-second roof challenges.</p>
</header>

<main class="game-grid" id="game-grid" aria-label="Available roof games">
  <!-- Game cards inserted by JS from game-card-data.js -->
</main>

<section class="cta-section">
  <a class="btn btn-accent" href="https://nanosealnb.ca/contact/" aria-label="Request your free assessment" id="assessment-link">REQUEST YOUR FREE ASSESSMENT</a>
</section>

<script src="game-card-data.js"></script>
<script>
(function () {
  'use strict';

  function trackGameEvent(eventName, data) {
    if (typeof console !== 'undefined' && console.log) console.log('[GameEvent]', eventName, data || {});
    if (typeof window.fbq === 'function') window.fbq('trackCustom', eventName, data || {});
    if (typeof window.gtag === 'function') window.gtag('event', eventName, data || {});
  }

  var grid = document.getElementById('game-grid');
  if (!grid || typeof GAME_CARD_DATA === 'undefined') return;

  GAME_CARD_DATA.forEach(function (game) {
    var card = document.createElement('a');
    card.className = 'game-card';
    card.href = game.url;
    card.setAttribute('aria-label', 'Play ' + game.name + ' now');

    var art = document.createElement('div');
    art.className = 'card-art';
    art.innerHTML = game.svg;

    var title = document.createElement('div');
    title.className = 'card-title';
    title.textContent = game.name;

    var desc = document.createElement('div');
    desc.className = 'card-desc';
    desc.textContent = game.description;

    var season = document.createElement('div');
    season.className = 'card-season';
    season.textContent = game.season;

    var play = document.createElement('div');
    play.className = 'card-play';
    play.textContent = 'PLAY NOW';

    card.appendChild(art);
    card.appendChild(season);
    card.appendChild(title);
    card.appendChild(desc);
    card.appendChild(play);
    grid.appendChild(card);

    card.addEventListener('click', function () {
      trackGameEvent('arcade_game_selected', { gameName: game.name, destination: game.url });
    });
  });

  var assessmentLink = document.getElementById('assessment-link');
  if (assessmentLink) {
    assessmentLink.addEventListener('click', function () {
      trackGameEvent('assessment_clicked', { url: 'https://nanosealnb.ca/contact/' });
    });
  }

  trackGameEvent('arcade_viewed', { page: 'roof-arcade' });
})();
</script>
</body>
